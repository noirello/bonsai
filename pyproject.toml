[build-system]
requires = [
    "setuptools >= 61.0.0",
    "wheel >= 0.30.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai"
description = "Python 3 module for accessing LDAP directory servers."
license = {text = "MIT"}
dynamic = ["version"]
authors = [{name = "noirello", email = "noirello@gmail.com"}]
requires-python = '>=3.10,<4.0'
readme = "README.rst"
keywords = [
    "python3",
    "ldap",
    "ldap3",
    "python-ldap",
    "libldap",
    "winldap",
    "asyncio",
    "gevent",
    "tornado",
    "trio"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]

[project.urls]
Homepage = "https://github.com/noirello/bonsai"
Repository = "https://github.com/noirello/bonsai.git"
Documentation = "https://bonsai.readthedocs.io"

[project.optional-dependencies]
gevent = ['gevent (>=1.4.0)']
tornado = ['tornado (>=5.1.1)']
trio = ['trio (>=0.16.0)']

# Only the Linux wheels are built with cibuildwheel; macOS and Windows keep their
# existing build. Every setting is under the linux table so nothing here can reach
# another platform, and the interpreter selection is passed by the workflow rather
# than set globally, because cibuildwheel does not allow build/skip to be scoped
# per platform.
[tool.cibuildwheel.linux]
archs = ["x86_64"]
# The wheels bundle their own OpenLDAP, Cyrus SASL, Kerberos and OpenSSL, built
# inside the container. Naming the prefix turns bundling on and build_ext derives
# its include and library directories from it, so the same one option works for
# anyone building against a prefix of their own. Passed as a build option rather
# than written into setup.cfg so that `setup.py build_py --help` stays the
# documentation for it.
before-all = "bash {project}/.ci/build-dependencies.sh"
config-settings = { "--build-option" = "build_py --bundled-deps=/opt/bonsai-deps" }
# cibuildwheel applies this to the repair step as well as the build, which is the
# step that needs it: auditwheel resolves DT_NEEDED through the loader search
# path, and musl reads its path from /etc/ld-musl-<arch>.path, which auditwheel
# does not consult.
environment = { LD_LIBRARY_PATH = "/opt/bonsai-deps/lib" }
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
test-requires = "pytest"
# Runs inside the build container, so it covers the wheel just produced without
# needing an LDAP server: licenses, bundled versions, exported symbols, and that
# the stdlib ssl module still uses the interpreter's own OpenSSL.
test-command = "python -m pytest -q {project}/tests/test_bundled.py"

[tool.poetry]
requires-poetry = '>=2.0'
version = '1.5.5'

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-timeout = "^2.3.0"
codecov = "2.1.13"
sphinx = "^8.0.0"
furo = "2025.12.19"
pylint = "^3.2.7"
mypy = "^1.11.2"
black = "26.5.1"
pydivert = { version = "^2.1", markers = "sys_platform == 'win32'" }
delocate = { version = "^0.12", markers = "sys_platform == 'darwin'" }

