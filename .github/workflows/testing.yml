name: Build

on:
  push:
  pull_request:
  schedule:
  - cron: '0 15 * * 5'

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      PYTHON: ${{ matrix.python-version }}
      OS: ubuntu

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install OS dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libldap2-dev libsasl2-dev ldap-utils sasl2-bin
        sudo apt-get install -y krb5-user libsasl2-modules-gssapi-mit libkrb5-dev
        apt list --installed
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry wheel
        poetry config virtualenvs.create false
        poetry install --no-root -E gevent -E tornado -E trio
        python -m pip list
    - name: Build Docker image
      run: docker build -t bonsai -f ./.ci/docker/Dockerfile .
    - name: Configure Docker container
      run: bash ./.github/workflows/scripts/setup_docker_server.sh
    - name: Wait on container to be ready
      run: bash ./.github/workflows/scripts/wait_container_ready.sh server 90
    - name: Wait on LDAP server
      run: bash ./.github/workflows/scripts/wait_ldap_server.sh 90
    - name: Check container and LDAP tools
      run: |
        docker exec server ps aux
        ldapwhoami -Y DIGEST-MD5 -H ldap://bonsai.test -U admin -w p@ssword
        ldapsearch -H ldap://bonsai.test -b "" -s base 'objectclass=*' -x -LLL +
        ldapsearch -VV
        saslpluginviewer
    - name: Check Python sysconfig
      run: python -m sysconfig
    - name: Install package
      run: |
        printf "\n\n[options]\nzip_safe = False" >> setup.cfg
        export CFLAGS="-coverage"
        python -m pip install -v .
    - name: Run tests
      run: |
        export BONSAI_DOCKER_IP=`docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' server`
        sed -i.bak "s/127.0.0.1/$BONSAI_DOCKER_IP/g" ./tests/test.ini
        export KRB5_CONFIG="`pwd`/.ci/krb5/krb5.conf"
        export BONSAI_INSTALL_PATH=`python -c "import bonsai; print(bonsai.__file__[:-12])"`
        echo $BONSAI_INSTALL_PATH
        python -m pytest -vs --cov-config .coveragerc --cov-report= --cov=$BONSAI_INSTALL_PATH
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        directory: "."
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  macos:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      PYTHON: ${{ matrix.python-version }}
      OS: macos

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Check OpenLDAP in brew
      run: |
        brew info openldap --verbose
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry wheel
        poetry config virtualenvs.create false
        poetry install --no-root -E gevent -E tornado -E trio
        python -m pip list
    - name: Install Docker
      id: setup-docker
      uses: douglascamata/setup-docker-macos-action@v1
      with:
        #lima: v1.2.1
        #colima: v0.9.1
        colima-network-address: false
    - name: Log Docker related versions
      run: |
        echo "Colima version: ${{ steps.setup-docker.outputs.colima-version }}"
        echo "Docker client version: ${{ steps.setup-docker.outputs.docker-client-version }}"
        echo "Docker compose version: ${{ steps.setup-docker.outputs.docker-compose-version }}"
    - name: Build Docker image
      run: docker build -t bonsai -f ./.ci/docker/Dockerfile .
    - name: Configure Docker container
      run: bash ./.github/workflows/scripts/setup_docker_server.sh
    - name: Wait on container to be ready
      run: bash ./.github/workflows/scripts/wait_container_ready.sh server 90
    - name: Wait on LDAP server
      run: bash ./.github/workflows/scripts/wait_ldap_server.sh 180
    - name: Check container and LDAP tools
      run: |
        docker exec server ps aux
        bash ./.github/workflows/scripts/check_digest_state.sh
        /usr/local/opt/openldap/bin/ldapsearch -x -H ldap://bonsai.test -b "" -s base 'objectclass=*' -LLL +
        /usr/local/opt/openldap/bin/ldapsearch -VV
        echo "INFO: kinit version"
        kinit --version
        echo "INFO: list SASL2 lib"
        ls -lah /usr/lib/sasl2
    - name: Check Python sysconfig
      run: python -m sysconfig
    - name: Install package
      run: |
        printf "[build_ext]\ninclude_dirs=/usr/local/opt/openldap/include\nlibrary_dirs=/usr/local/opt/openldap/lib" > ./setup.cfg
        printf "\n\n[options]\nzip_safe = False" >> setup.cfg
        export CFLAGS="-coverage"
        python -m pip install -v .
    - name: Check linking
      run: |
        otool -L ./build/*/bonsai/*.so
    - name: Run tests
      run: |
        export KRB5_CONFIG="`pwd`/.ci/krb5/krb5.conf"
        export BONSAI_INSTALL_PATH=`python -c "import bonsai; print(bonsai.__file__[:-12])"`
        echo $BONSAI_INSTALL_PATH
        py.test -vs --cov-config .coveragerc --cov-report= --cov=$BONSAI_INSTALL_PATH
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        directory: "."
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
      if: ${{ github.event_name != 'schedule' }}

  macos-wheels:
    needs: macos
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
        - runner: macos-15-intel
          arch: x86_64
    steps:
    - uses: actions/checkout@v7
    - name: Build wheels
      uses: pypa/cibuildwheel@v4.3.5
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD_VERBOSITY: 3
        CIBW_SKIP: cp3??t-*
      with:
        package-dir: .
        output-dir: wheelhouse
    - name: Check wheels
      run: |
        ls -la ./wheelhouse/
        for whl in ./wheelhouse/*.whl; do
          echo "== $whl"
          unzip -l "$whl" | grep "\.dylibs/libldap"
          unzip -l "$whl" | grep "licenses/"
        done
    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheel-macos-${{ matrix.arch }}
        path: ./wheelhouse/*.whl
        retention-days: 5

  linux-wheels:
    needs: ubuntu
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build Docker image
      run: docker build -t bonsai -f ./.ci/docker/Dockerfile .
    - name: Configure Docker container
      run: bash ./.github/workflows/scripts/setup_docker_server.sh
    - name: Wait on container to be ready
      run: bash ./.github/workflows/scripts/wait_container_ready.sh server 90
    - name: Get server IP
      run: echo "BONSAI_DOCKER_IP=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' server)" >> $GITHUB_ENV
    - name: Build wheels
      uses: pypa/cibuildwheel@v4.3.5
      env:
        CIBW_BUILD_VERBOSITY: 3
        CIBW_SKIP: cp3??t-*
      with:
        package-dir: .
        output-dir: wheelhouse
    - name: Check wheels
      # grep fails the step if a wheel carries neither the bundled libraries nor the license
      # inventory, which is what an unbundled build would silently produce.
      run: |
        ls -la ./wheelhouse/
        for whl in ./wheelhouse/*.whl; do
          echo "== $whl"
          unzip -l "$whl" | grep -E "bonsai.libs|licenses/"
        done
    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheel-linux-x86_64
        path: ./wheelhouse/*.whl
        retention-days: 5
