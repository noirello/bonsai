hosts:
  bonsai.test:  127.0.0.1

image: Visual Studio 2019

environment:
  global:
    # SDK v7.0 MSVC Express 2008's SetEnv.cmd script will fail if the
    # /E:ON and /V:ON options are not enabled in the batch script interpreter
    # See: http://stackoverflow.com/a/13751649/163740
    CMD_IN_ENV: "cmd /E:ON /V:ON /C .\\.appveyor\\run_with_env.cmd"

  matrix:
    - PYTHON: "C:\\Python311"
      PYTHON_VERSION: "3.11.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python311-x64"
      PYTHON_VERSION: "3.11.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python312"
      PYTHON_VERSION: "3.12.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python312-x64"
      PYTHON_VERSION: "3.12.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python313"
      PYTHON_VERSION: "3.13.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python313-x64"
      PYTHON_VERSION: "3.13.x"
      PYTHON_ARCH: "64"

    - PYTHON: "C:\\Python314"
      PYTHON_VERSION: "3.14.x"
      PYTHON_ARCH: "32"

    - PYTHON: "C:\\Python314-x64"
      PYTHON_VERSION: "3.14.x"
      PYTHON_ARCH: "64"

    # Python 3.15 is not preinstalled on the Visual Studio 2019 image.
    - PYTHON: "C:\\Python315"
      PYTHON_VERSION: "3.15.x"
      PYTHON_ARCH: "32"
      PYTHON_INSTALLER_VERSION: "3.15.2"

    - PYTHON: "C:\\Python315-x64"
      PYTHON_VERSION: "3.15.x"
      PYTHON_ARCH: "64"
      PYTHON_INSTALLER_VERSION: "3.15.2"

install:
  # If there is a newer build queued for the same PR, cancel this one.
  # The AppVeyor 'rollout builds' option is supposed to serve the same
  # purpose but it is problematic because it tends to cancel builds pushed
  # directly to master instead of just PR builds (or the converse).
  # credits: JuliaLang developers.
  - ps: if ($env:APPVEYOR_PULL_REQUEST_NUMBER -and $env:APPVEYOR_BUILD_NUMBER -ne ((Invoke-RestMethod `
        https://ci.appveyor.com/api/projects/$env:APPVEYOR_ACCOUNT_NAME/$env:APPVEYOR_PROJECT_SLUG/history?recordsNumber=50).builds | `
        Where-Object pullRequestId -eq $env:APPVEYOR_PULL_REQUEST_NUMBER)[0].buildNumber) { `
          throw "There are newer queued builds for this pull request, failing early." }
  # Install Active Directory and reboot the machine.
  - ps: .\\.appveyor\\InstallAD.ps1
  - ps: Start-Sleep -s 5
  - ps: Write-Output 'Finished installing Active Directory.'
  - ps: .\\.appveyor\\ConfigAD.ps1
  - "ldifde -i -v -f .\\tests\\testenv\\ldifs\\users.ldif"

  # Install Python if the image does not have it preinstalled.
  - ps: |
      if ($env:PYTHON_INSTALLER_VERSION) {
        $ErrorActionPreference = 'Stop'
        if (Test-Path (Join-Path $env:PYTHON 'python.exe')) {
          Write-Output "Python is already installed in $env:PYTHON."
        } else {
          $version = $env:PYTHON_INSTALLER_VERSION
          # The 32-bit installer has no architecture suffix in its name.
          $archSuffix = if ($env:PYTHON_ARCH -eq "64") { "-amd64" } else { "" }
          $installer = "python-$version$archSuffix.exe"
          $url = "https://www.python.org/ftp/python/$version/$installer"
          $installerPath = Join-Path $env:TEMP $installer

          Write-Output "Installing Python $version ($env:PYTHON_ARCH-bit) from $url"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $installerPath -UseBasicParsing

          $arguments = @(
            "/quiet",
            "InstallAllUsers=1",
            "TargetDir=$env:PYTHON",
            "Include_pip=1",
            "Include_dev=1",
            "Include_launcher=0",
            "Include_test=0",
            "Include_doc=0",
            "PrependPath=0",
            "Shortcuts=0"
          )
          $process = Start-Process -FilePath $installerPath -ArgumentList $arguments -Wait -PassThru
          # 3010 means success, but a reboot is pending.
          if ($process.ExitCode -notin 0, 3010) {
            throw "Python $version installer exited with code $($process.ExitCode)"
          }
          Remove-Item $installerPath
          if (-not (Test-Path (Join-Path $env:PYTHON 'python.exe'))) {
            throw "python.exe was not found in $env:PYTHON after the installation."
          }
        }
      }


  # Prepend newly installed Python to the PATH of this build (this cannot be
  # done from inside the powershell script as it would require to restart
  # the parent CMD process).
  - "SET PATH=%PYTHON%;%PYTHON%\\Scripts;%PATH%"

  # Check that we have the expected version and architecture for Python
  - "python --version"
  - "python -c \"import struct; print(struct.calcsize('P') * 8)\""

  # Upgrade to the latest version of pip to avoid it displaying warnings
  # about it being out of date.
  - "%PYTHON%\\python.exe -m pip install --disable-pip-version-check --user --upgrade pip"
  - "%PYTHON%\\python.exe -m pip install poetry wheel build"
  - "%PYTHON%\\python.exe -m poetry config virtualenvs.create false"
  - "%PYTHON%\\python.exe -m poetry install --no-root -E gevent -E tornado -E trio"
  - "%PYTHON%\\python.exe -m pip list"

build_script:
  # Build the compiled extension
  - "%CMD_IN_ENV% python -m pip install -vvv --user ."

before_test:
  - ps: "Start-Process python -ArgumentList .\\.ci\\delay.py -Verb runas"
  # Change hostname to the computer's FQDN.
  - ps: "(Get-Content .\\tests\\test.ini).replace('hostname = bonsai.test', 'hostname = appveyor-vm.bonsai.test') | Set-Content '.\\tests\\test.ini'"

test_script:
  # Set install path for coverage.py.
  - for /f "tokens=*" %%i in ('python -c "import bonsai; print(bonsai.__file__[:-12])"') do set INSTALL_PATH="%%i"
  # Run the tests.
  - "%CMD_IN_ENV% python -m pytest -v --junitxml=.\\test-results.xml --cov-config .coveragerc --cov-report= --cov=%INSTALL_PATH% --durations=10"

after_test:
  # Rename the coverage data so that "coverage combine" can remap the
  # installed paths to the project source paths using the [paths] section.
  - ps: "if (Test-Path .\\.coverage) { Move-Item -Force .\\.coverage .\\.coverage.appveyor }"
  - "%CMD_IN_ENV% python -m coverage combine"
  - codecov
  # Upload test results.
  - ps: $wc = New-Object 'System.Net.WebClient'; `
        $wc.UploadFile("https://ci.appveyor.com/api/testresults/junit/$($env:APPVEYOR_JOB_ID)", (Resolve-Path .\\test-results.xml))
  # If tests are successful, create binary packages for the project.
  - "%CMD_IN_ENV% python -m build -w"
  - ps: "ls dist"

artifacts:
  # Archive the generated packages in the ci.appveyor.com build report.
  - path: dist\*

